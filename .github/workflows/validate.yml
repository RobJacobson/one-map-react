name: Pull request validation

on: pull_request

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output kotlin-compiler-2.2.0.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          echo '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  kotlin-compiler-2.2.0.zip' | shasum -a 256 --check
          unzip -q kotlin-compiler-2.2.0.zip
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run validation
        env:
          ONE_MAP_KOTLINC: ${{ runner.temp }}/kotlinc/bin/kotlinc
        run: bun run validate
